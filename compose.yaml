services:
  # TODO: RENAME — sostituisci 'mitur-starter' con il nome del tuo package
  mitur-starter:
    build:
      context: .
      dockerfile: Dockerfile
    # Carica le variabili d'ambiente da .env (credenziali, host DB, ecc.)
    # Copia .env.example → .env e valorizza le variabili prima di avviare
    env_file: .env
    environment:
      # Carica application-docker.properties (actuator health+info, logging JSON)
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

