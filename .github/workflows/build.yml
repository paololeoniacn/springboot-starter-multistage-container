name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & Test
        run: mvn clean package --no-transfer-progress -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    # Non blocca il merge ma segnala vulnerabilità
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run OWASP Dependency Check
        run: |
          mvn dependency-check:check --no-transfer-progress -B \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
          || true
        # NVD_API_KEY: opzionale, senza è più lento ma funziona
        # Richiedi gratis su https://nvd.nist.gov/developers/request-an-api-key

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
