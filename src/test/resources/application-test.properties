# ── Profilo TEST — H2 in-memory, nessuna infrastruttura esterna richiesta ──────
#
# Usato automaticamente da @SpringBootTest + @ActiveProfiles("test").
# Queste properties sovrascrivono application.properties eliminando
# la necessità di PostgreSQL e AWS reali in CI.

# ── Database: H2 in-memory al posto di PostgreSQL ───────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# create-drop: H2 crea le tabelle dalle entity JPA e le distrugge a fine test
spring.jpa.hibernate.ddl-auto=create-drop
# Schema vuoto: H2 non usa schemi separati
spring.jpa.properties.hibernate.default_schema=

# ── AWS S3 — stub (il bean S3Client viene creato ma non si connette a S3) ───
# Il costruttore S3Client di AWS SDK v2 è lazy: non stabilisce connessioni.
# I test che chiamano S3Service falliranno (come atteso). Per testare
# l'integrazione S3 usare @MockBean S3Service.
aws.region=eu-south-1
aws.access-key=test
aws.secret-key=test
aws.s3.bucket-name=test-bucket
aws.s3.internal-base-path=internal/

# ── Profilo / ambiente ───────────────────────────────────────────────────────
env=DEV
