# ═══════════════════════════════════════════════════════════════════════════════
# TODO: RENAME — sostituisci 'mitur-starter' con il nome del tuo package
# ═══════════════════════════════════════════════════════════════════════════════
spring.application.name=mitur-starter

# ── Ambiente e profilo ──────────────────────────────────────────────────────
# ENV viene iniettato dal container/CI: DEV | STAGE | PROD
# Default DEV per sviluppo locale (viene da .env se spring-dotenv è attivo)
env=${ENV:DEV}
spring.profiles.active=${env}


# ── Logging (override centralizzato) ────────────────────────────────────────
#
# Di default il livello è deciso dall'ambiente via logback-spring.xml:
#   DEV/STAGE → INFO   |   PROD → ERROR
#
# Tieni commentato per usare il default basato su 'env'.
# Decommentare TEMPORANEAMENTE per forzare un livello diverso (vince sempre):
# mitur.logging.root-level=INFO

# Di default in PROD NON include e.getMessage() nei log ERROR (sicurezza).
# In DEV/STAGE lo include. Decommentare TEMPORANEAMENTE per diagnostica in PROD:
# mitur.logging.include-exception-message=true


# ── Sicurezza: protezione duplicati ─────────────────────────────────────────
# Rifiuta JSON con chiavi duplicate nel body (es. {"a":1,"a":2} → 400)
mitur.json.reject-duplicate-keys=true
# Rifiuta query param duplicati su /api/** (es. ?id=1&id=2 → 400)
mitur.params.reject-duplicates=true


# ── AWS S3 ───────────────────────────────────────────────────────────────────
# TODO: RENAME — imposta il nome bucket e il path S3 per il tuo package
# Tutte le credenziali vengono da env vars (mai hardcoded)
aws.region=${AWS_REGION}
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.s3.bucket-name=${AWS_BUCKET_NAME}
aws.s3.internal-base-path=internal/

# TODO: RENAME — cambia 'starter' con il nome del tuo dominio
# Es.: internal/mypackage, internal/tuo-servizio
mitur.audit.s3-path-prefix=internal/starter


# ── PostgreSQL + HikariCP ────────────────────────────────────────────────────
# TODO: impostare POSTGRES_HOST, POSTGRES_PORT, POSTGRES_DB, POSTGRES_USER,
#       POSTGRES_PASSWORD, POSTGRES_SCHEMA in .env o nei segreti CI/CD
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.properties.hibernate.default_schema=${POSTGRES_SCHEMA}
spring.datasource.driver-class-name=org.postgresql.Driver
# ddl-auto=none: le tabelle sono gestite manualmente (o via Flyway) — mai auto-create
spring.jpa.hibernate.ddl-auto=none

# HikariCP — valori allineati ai package di produzione MiTur
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.keepalive-time=0
# Decommentare per debug HikariCP:
# logging.level.com.zaxxer.hikari=DEBUG


# ── WebClient Connection Pool ────────────────────────────────────────────────
# 240s < 330s (idle timeout PSN ~5.5min) — margine ~90s per evitare connessioni stale
webclient.max-idle-time-seconds=240
# Decommentare per debug HTTP delle chiamate WebClient:
# logging.level.org.springframework.web.reactive.function.client.ExchangeFunctions=DEBUG
# logging.level.reactor.netty.http.client.HttpClient=DEBUG


# ── Encoding ─────────────────────────────────────────────────────────────────
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.tomcat.uri-encoding=UTF-8
